# Keep the scheme a TLS terminator in front of nginx reported (OIDC redirect URIs and the same-origin sign-out check
# need the public https scheme); fall back to nginx's own scheme when there is none.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Uploads up to the API's own limit.
  client_max_body_size 50m;

  # Ask answers stream as Server-Sent Events: don't buffer them. ^~ so this wins over the regex location below.
  location ^~ /api/answers/stream {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # Same origin: the API, sign-in and OIDC callbacks are proxied, so the session cookie is first-party.
  location ~ ^/(api|auth|signin-oidc|signout-callback-oidc)(/|$) {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # BrowserRouter: unknown paths fall back to the SPA entry point.
  location / {
    try_files $uri /index.html;
  }
}
